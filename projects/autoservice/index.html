<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Автосервис</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
            text-align: center;
        }

        header {
            background: #8a01b8;
            padding: 60px 20px;
        }

        h1 {
            font-size: 48px;
        }

        p {
            color: #ccc;
            font-size: 18px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
        }

        .card {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 15px;
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #8a01b8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            background: #a900e0;
        }

    </style>

</head>


<body>


<header>

    <h1>Автосервис</h1>

    <p>
        Современный сайт для автомобильного сервиса
    </p>

</header>



<div class="container">


    <div class="card">

        <h2>Наши услуги</h2>

        <p>
            Диагностика автомобиля, ремонт двигателя,
            техническое обслуживание и консультация специалистов.
        </p>

    </div>



    <div class="card">

        <h2>Почему мы?</h2>

        <p>
            Качественный ремонт, опытные мастера
            и современное оборудование.
        </p>

    </div>



    <a class="button" href="../../index.html">
        Вернуться в портфолио
    </a>


</div>


</body>

</html>
